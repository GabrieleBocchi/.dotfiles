[org/gnome/desktop/wm/preferences]
audible-bell=false
button-layout=':close'
focus-mode='click'
visual-bell=true
visual-bell-type='frame-flash'

[org/gnome/mutter]
auto-maximize=true
center-new-windows=true
dynamic-workspaces=true
edge-tiling=true
overlay-key='Super'
workspaces-only-on-primary=true
