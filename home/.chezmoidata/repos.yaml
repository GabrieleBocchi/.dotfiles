# Repositories to enable before installing packages, keyed by distro family.
#
# Every entry has `kind` + `name`; any other field is passed to `enable_repo`
# as `key=value` (see scripts/pkg-utils.sh for per-kind handling).
repos:
  # ── apk family ──────────────────────────────────────────────────────────────
  alpine:
    base: []
    desktop:
      - kind: apk-testing
        name: ghostty

  # ── apt-get families ────────────────────────────────────────────────────────
  debian:
    base:
      - kind: deb-release
        name: fastfetch
        url: "https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb"
      - kind: custom
        name: hashicorp
        uri: "https://apt.releases.hashicorp.com"
        suites: "$codename"
        components: "main"
        signed_by: "https://apt.releases.hashicorp.com/gpg"
    desktop: []

  ubuntu:
    base:
      - kind: deb-release
        name: fastfetch
        url: "https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb"
      - kind: custom
        name: hashicorp
        uri: "https://apt.releases.hashicorp.com"
        suites: "$codename"
        components: "main"
        signed_by: "https://apt.releases.hashicorp.com/gpg"
    desktop: []

  # ── dnf families ────────────────────────────────────────────────────────────
  fedora:
    base:
      - kind: custom
        name: hashicorp
        baseurl: "https://rpm.releases.hashicorp.com/$distro/$releasever/$basearch/stable"
        gpgkey: "https://rpm.releases.hashicorp.com/gpg"
    desktop:
      - kind: copr
        name: peterwu/rendezvous
      - kind: copr
        name: scottames/ghostty

  rhel:
    base:
      - kind: custom
        name: hashicorp
        baseurl: "https://rpm.releases.hashicorp.com/$distro/$releasever/$basearch/stable"
        gpgkey: "https://rpm.releases.hashicorp.com/gpg"
      - kind: rpm-release
        name: epel-release
        url: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-$releasever.noarch.rpm"
    desktop: []
