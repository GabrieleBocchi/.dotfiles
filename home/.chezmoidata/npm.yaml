# Global npm packages, installed via `npm install -g`.
npm:
  base:
    - name: "@j178/prek@0.5.9"
    - name: "@playwright/mcp@0.0.84"
    - name: "@upstash/context7-mcp@4.5.0"
    - name: bun@1.4.4
      args: ["--allow-scripts=bun"] # its postinstall (node install.js) fetches the bun binary
    - name: npm@12.2.1
    - name: opencode-ai@1.19.5
      args: ["--allow-scripts=opencode-ai"] # npm blocks its postinstall (binary fetch) otherwise
  desktop: []
