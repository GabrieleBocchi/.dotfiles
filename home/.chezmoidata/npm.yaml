# Global npm packages, installed via `npm install -g`.
npm:
  base:
    - name: "@j178/prek@0.5.10"
    - name: "@opencode/cli@2.2.7"
      args: ["--allow-scripts=@opencode/cli"] # npm blocks its postinstall (binary fetch) otherwise
    - name: "@playwright/mcp@0.0.85"
    - name: "@upstash/context7-mcp@4.6.0"
    - name: bun@1.4.4
      args: ["--allow-scripts=bun"] # its postinstall (node install.js) fetches the bun binary
    - name: ccstatusline@2.2.34
    - name: npm@12.2.2
  desktop: []
