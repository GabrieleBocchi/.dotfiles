# Maps os-release ids to a family and its package manager.
families:
  # ── apk family ──────────────────────────────────────────────────────────────
  alpine:
    pm: apk
    distros: [alpine]

  # ── apt-get families ────────────────────────────────────────────────────────
  debian:
    pm: apt-get
    distros: [debian]
  ubuntu:
    pm: apt-get
    distros: [ubuntu]

  # ── dnf families ────────────────────────────────────────────────────────────
  fedora:
    pm: dnf
    distros: [fedora]
  rhel:
    pm: dnf
    distros: [almalinux, centos, ol, rhel, rocky]
