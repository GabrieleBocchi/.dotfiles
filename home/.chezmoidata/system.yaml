common:
  base:
    pm:
      - bash
      - bat
      - curl
      - fastfetch
      - gcc
      - git
      - make
      - neovim
      - npm
      - podman
      - sudo
      - tar
      - tmux
      - wget
      - zsh
    script:
      - name: Uv
        url: "https://astral.sh/uv/install.sh"
        envs: ["UV_NO_MODIFY_PATH=1"]
      - name: Rust
        url: "https://sh.rustup.rs"
        args: ["--no-modify-path", "-y"]
      - name: Terragrunt
        url: "https://terragrunt.com/install"
        args: ["--force"]
  desktop:
    pm:
      - fontconfig
      - papirus-icon-theme
    script: []

apk:
  base:
    pm:
      - github-cli
      - musl-dev
      - shadow
      - vimdiff
    script: []
  desktop:
    pm:
      - chromium
      - ghostty
      - spotify-qt
    script: []

apt-get:
  base:
    pm:
      - gh
      - libc6-dev
      - vim
    script: []
  desktop:
    pm:
      - bibata-cursor-theme
      - google-chrome-stable
      - spotify-client
    script:
      - name: Ghostty
        url: "https://raw.githubusercontent.com/mkasberg/ghostty-ubuntu/HEAD/install.sh"
    repos:
      - kind: custom
        name: google-chrome
        uri: "https://dl.google.com/linux/chrome/deb/"
        suites: "stable"
        components: "main"
        signed_by: "https://dl.google.com/linux/linux_signing_key.pub"
      - kind: custom
        name: spotify
        uri: "https://repository.spotify.com"
        suites: "stable"
        components: "non-free"
        signed_by: "https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.gpg"

dnf:
  base:
    pm:
      - gh
      - vim-enhanced
    script: []
  desktop:
    pm:
      - bibata-cursor-themes
      - ghostty
      - google-chrome-stable
      - spotify-client
    script: []
    repos:
      - kind: copr
        name: peterwu/rendezvous
      - kind: copr
        name: scottames/ghostty
      - kind: custom
        name: google-chrome
        baseurl: "https://dl.google.com/linux/chrome/rpm/stable/x86_64"
        gpgkey: "https://dl.google.com/linux/linux_signing_key.pub"
      - kind: custom
        name: fedora-spotify
        baseurl: "https://negativo17.org/repos/spotify/fedora-$releasever/$basearch/"
        gpgkey: "https://negativo17.org/repos/RPM-GPG-KEY-slaanesh"
