common:
  packages:
    base:
      pm:
        - bash
        - bat
        - curl
        - fastfetch
        - gcc
        - git
        - make
        - neovim
        - npm
        - podman
        - sudo
        - tar
        - tmux
        - wget
        - zsh
      script:
        - name: Uv
          url: "https://astral.sh/uv/install.sh"
          envs: ["UV_NO_MODIFY_PATH=1"]
        - name: Rust
          url: "https://sh.rustup.rs"
          args: ["--no-modify-path", "-y"]
        - name: Terragrunt
          url: "https://terragrunt.com/install"
          args: ["--force"]
    desktop:
      pm:
        - alacritty
        - fontconfig
      script: []

apk:
  packages:
    base:
      pm:
        - github-cli
        - musl-dev
        - shadow
        - vimdiff
      script: []
    desktop:
      pm: []
      script: []

apt-get:
  packages:
    base:
      pm:
        - gh
        - vim
      script: []
    desktop:
      pm: []
      script: []

dnf:
  copr: []
  packages:
    base:
      pm:
        - gh
        - vim-enhanced
      script: []
    desktop:
      pm: []
      script: []
