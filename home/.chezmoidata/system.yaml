# System packages & script installers, keyed by distro family.
#
# Each section holds packages/scripts for exactly its family.
#
# `pm`:   native packages installed via the family's package manager.
# `script`: URL-based installers (name/url/args/envs).
common:
  base:
    pm:
      - bash
      - bat
      - btop
      - curl
      - gcc
      - git
      - jq
      - keychain
      - make
      - neovim
      - podman
      - sudo
      - tar
      - tmux
      - unzip
      - wget
      - zsh
    script:
      - name: Rust
        url: "https://sh.rustup.rs"
        args: ["--no-modify-path", "--quiet", "-y"]
      - name: Starship
        url: "https://starship.rs/install.sh"
        args: ["--yes"]
      - name: Terragrunt
        url: "https://terragrunt.com/install"
        args: ["--force"]
      - name: Uv
        url: "https://astral.sh/uv/install.sh"
        envs: ["UV_NO_MODIFY_PATH=1"]
      - name: Fnm
        url: "https://fnm.vercel.app/install"
        args: ["--skip-shell"]
  desktop:
    pm:
      - fontconfig
      - papirus-icon-theme
    script: []

# ── apk family ──────────────────────────────────────────────────────────────

alpine:
  base:
    pm:
      - fastfetch
      - github-cli
      - gnupg
      - libgcc
      - libstdc++
      - musl-dev
      - openssh-client-default
      - shadow
      - vimdiff
    script: []
  desktop:
    pm:
      - chromium
      - spotify-qt
      - telegram-desktop
    script: []

# ── apt-get families ────────────────────────────────────────────────────────

debian:
  base:
    pm:
      - gh
      - gnupg
      - libc6-dev
      - procps
      - terraform
      - vim
    script: []
  desktop:
    pm:
      # NOTE: NO telegram (atareao/telegram PPA is Ubuntu-only) on Debian.
      - bibata-cursor-theme
      - google-chrome-stable
      - spotify-client
      - teams-for-linux
    script: []

ubuntu:
  base:
    pm:
      - gh
      - gnupg
      - libc6-dev
      - procps
      - terraform
      - vim
    script: []
  desktop:
    pm:
      - bibata-cursor-theme
      - google-chrome-stable
      - spotify-client
      - teams-for-linux
      - telegram
    script:
      - name: Ghostty
        url: "https://raw.githubusercontent.com/mkasberg/ghostty-ubuntu/HEAD/install.sh"

# ── dnf families ────────────────────────────────────────────────────────────

fedora:
  base:
    pm:
      - fastfetch
      - gh
      - gnupg2
      - procps-ng
      - terraform
      - util-linux-user
      - vim-enhanced
    script: []
  desktop:
    pm:
      - bibata-cursor-themes
      - ghostty
      - google-chrome-stable
      - spotify-client
      - teams-for-linux
      - telegram-desktop
    script: []

rhel:
  base:
    pm:
      - fastfetch
      - gh
      - gnupg2
      - procps-ng
      - terraform
      - util-linux-user
      - vim-enhanced
    script: []
  desktop:
    pm:
      # NOTE: NO bibata, Ghostty, Spotify and telegram (Fedora-only / not packaged for EL10).
      - google-chrome-stable
      - teams-for-linux
    script: []
