# System packages (`pm`) and URL-based installers (`script`), keyed by family.
common:
  base:
    pm:
      - bash
      - bat
      - btop
      - curl
      - gcc
      - git
      - jq
      - keychain
      - make
      - neovim
      - podman
      - sudo
      - tar
      - tmux
      - unzip
      - wget
      - zsh
    script:
      - name: Claude Code
        url: "https://claude.ai/install.sh"
      - name: Fnm
        url: "https://fnm.vercel.app/install"
        args: ["--skip-shell"]
      - name: Rust
        url: "https://sh.rustup.rs"
        args: ["--no-modify-path", "--quiet", "-y"]
      - name: Starship
        url: "https://starship.rs/install.sh"
        args: ["--yes"]
      - name: Terragrunt
        url: "https://terragrunt.com/install"
        args: ["--force"]
      - name: Uv
        url: "https://astral.sh/uv/install.sh"
        envs: ["UV_NO_MODIFY_PATH=1"]
  desktop:
    pm:
      - flatpak
      - fontconfig
      - papirus-icon-theme
    script: []

# ── apk family ──────────────────────────────────────────────────────────────

alpine:
  base:
    pm:
      - aws-cli
      - fastfetch
      - github-cli
      - gnupg
      - libgcc
      - libstdc++
      - musl-dev
      - openssh-client-default
      - ripgrep
      - shadow
      - vimdiff
    script: []
  desktop:
    pm: []
    script: []

# ── apt-get families ────────────────────────────────────────────────────────

debian:
  base:
    pm:
      - awscli
      - gh
      - gnupg
      - libatomic1 # needed by node
      - libc6-dev
      - procps
      - terraform
      - vim
    script: []
  desktop:
    pm:
      - bibata-cursor-theme
    script: []

ubuntu:
  base:
    pm:
      - awscli
      - gh
      - gnupg
      - libatomic1 # needed by node
      - libc6-dev
      - procps
      - terraform
      - vim
    script: []
  desktop:
    pm:
      - bibata-cursor-theme
    script:
      - name: Ghostty
        url: "https://raw.githubusercontent.com/mkasberg/ghostty-ubuntu/HEAD/install.sh"

# ── dnf families ────────────────────────────────────────────────────────────

fedora:
  base:
    pm:
      - awscli2
      - fastfetch
      - gh
      - gnupg2
      - libatomic # needed by node
      - procps-ng
      - terraform
      - util-linux-user
      - vim-enhanced
    script: []
  desktop:
    pm:
      - bibata-cursor-themes
      - ghostty
    script: []

rhel:
  base:
    pm:
      - awscli2
      - fastfetch
      - gh
      - gnupg2
      - libatomic # needed by node
      - procps-ng
      - terraform
      - util-linux-user
      - vim-enhanced
    script: []
  desktop:
    pm: []
    script: []
