# Flatpak remotes and applications, installed only when a GUI session is detected.
flatpak:
  remotes:
    - name: flathub
      url: "https://dl.flathub.org/repo/flathub.flatpakrepo"
  apps:
    - remote: flathub
      name: com.github.IsmaelMartinez.teams_for_linux
    - remote: flathub
      name: com.google.Chrome
    - remote: flathub
      name: com.spotify.Client
    - remote: flathub
      name: dev.vencord.Vesktop
    - remote: flathub
      name: org.telegram.desktop
